[package]
name = "prow-demo"
version = "0.1.0"
edition = "2021"
description = "Every prow hook in a small program, for trying a server end to end."
license = "MIT"
publish = false

[dependencies]
prow = { path = ".." }

[build-dependencies]
prow = { path = ".." }

# The categories this crate's hooks name. Build with none for the zero-tracking baseline.
[features]
default = ["track-step", "track-zones", "track-store"]
track-step = []
track-zones = []
track-store = []
