# Publishes the `prow` crate (the client) to crates.io when a tag v<version> is pushed. The tag must
# match the version in Cargo.toml. The server, web app and demo are not published.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the tag matches the crate's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "prow") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, crate version $version"; exit 1; }
      - run: cargo test --workspace
      - run: cargo publish -p prow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
